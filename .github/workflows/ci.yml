name: CI

on:
  push:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartstay
          POSTGRES_PASSWORD: smartstay
          POSTGRES_DB: smartstay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstay -d smartstay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://smartstay:smartstay@localhost:5432/smartstay_test?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run backend tests
        run: npm test
